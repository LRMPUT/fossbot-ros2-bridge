services:
  fossbot_bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: fossbot_bridge:jazzy
    container_name: fossbot_bridge
    # Host networking is required, not convenience: the robot pushes telemetry
    # to UDP 5005 on this machine. Behind Docker's NAT the agent would have to
    # reply to a translated address, and DDS discovery for any ROS node outside
    # the container would not work either.
    network_mode: host
    ipc: host
    environment:
      # Which robot to talk to: hostname or IP. Read by the bringup launch file.
      - FOSSBOT_HOST=${FOSSBOT_HOST:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      # Live-mount the source so edits take effect without a rebuild
      # (the image is built with --symlink-install).
      - ./ws/src:/ws/src
    stdin_open: true
    tty: true
    command: sleep infinity
